spring:
  datasource:
    url: jdbc:h2:mem:lupacnpj_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

app:
  jwt:
    secret: test-secret-key-with-at-least-32-characters-long
    expiration-hours: 24
