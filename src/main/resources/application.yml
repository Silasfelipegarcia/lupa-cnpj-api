server:
  port: ${PORT:8080}
  tomcat:
    max-connections: 50
    accept-count: 10
    threads:
      max: 20
      min-spare: 2
  connection-timeout: 10s

spring:
  application:
    name: lupa-insights-api
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  cors-allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,https://lupa-insights.vercel.app,https://*.vercel.app}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars}
    expiration-hours: 24
  security:
    import-per-hour: 5
    status-per-minute: 30
    download-per-hour: 10
    template-per-hour: 10
    auth-per-minute: 10
    max-rows-per-file: 900
    max-queue-size: 10
    max-jobs-in-memory: 50
    max-active-jobs-per-ip: 1
    max-active-jobs-per-user: 1
    job-ttl-hours: 24
    guest-preview-max: 1
    guest-preview-window-days: 365
    guest-preview-per-minute: 10
    payments-per-minute: 20
    analytics-per-minute: 60
    password-change-per-hour: 5
    import-per-user-per-hour: 10
    login-failures-before-lock: 5
    login-lock-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health

cnpj:
  api:
    base-url: https://publica.cnpj.ws/cnpj
    pesquisa-url: https://comercial.cnpj.ws/v2/pesquisa
    token: ${CNPJ_WS_TOKEN:${CNPJ_API_TOKEN:}}
    pesquisa-razao-social-habilitada: ${PESQUISA_RAZAO_SOCIAL:false}
    rate-limit-per-minute: 3
    commercial-rate-limit-per-minute: 60
    timeout-seconds: 30

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  public-key: ${MERCADOPAGO_PUBLIC_KEY:}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  api-public-url: ${API_PUBLIC_URL:http://localhost:8080}
  premium-price-cents: ${MERCADOPAGO_PREMIUM_PRICE_CENTS:1990}
  pro-plus-price-cents: ${MERCADOPAGO_PRO_PLUS_PRICE_CENTS:4990}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}

logging:
  level:
    br.com.lupainsights: INFO
    AUDIT: INFO
