server:
  port: ${PORT:8080}

app:
  cors-allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

cnpj:
  api:
    base-url: https://publica.cnpj.ws/cnpj
    pesquisa-url: https://comercial.cnpj.ws/v2/pesquisa
    token: ${CNPJ_WS_TOKEN:}
    rate-limit-per-minute: 3
    timeout-seconds: 30

logging:
  level:
    br.com.dadoscnpj: INFO
