server:
  port: ${PORT:8080}
  tomcat:
    max-connections: 50
    accept-count: 10
    threads:
      max: 20
      min-spare: 2
  connection-timeout: 10s

app:
  cors-allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,https://lupa-cnpj.vercel.app,https://*.vercel.app}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars}
    expiration-hours: 24
  security:
    import-per-hour: 5
    status-per-minute: 30
    download-per-hour: 10
    template-per-hour: 10
    auth-per-minute: 10
    max-rows-per-file: 900
    max-queue-size: 10
    max-jobs-in-memory: 50
    max-active-jobs-per-ip: 1
    max-active-jobs-per-user: 1
    job-ttl-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lupacnpj}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

cnpj:
  api:
    base-url: https://publica.cnpj.ws/cnpj
    pesquisa-url: https://comercial.cnpj.ws/v2/pesquisa
    token: ${CNPJ_WS_TOKEN:${CNPJ_API_TOKEN:}}
    pesquisa-razao-social-habilitada: ${PESQUISA_RAZAO_SOCIAL:false}
    rate-limit-per-minute: 3
    commercial-rate-limit-per-minute: 60
    timeout-seconds: 30

logging:
  level:
    br.com.dadoscnpj: INFO
