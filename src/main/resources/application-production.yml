spring:
  datasource:
    # DB_URL deve ser JDBC (jdbc:mysql://...). MYSQL_URL do Railway é tratada em DatabaseConfig.
    url: ${DB_URL:}
    username: ${DB_USERNAME:${MYSQLUSER:}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS:8}
  cors-allowed-origins: ${ALLOWED_ORIGINS:https://www.lupacnpjs.com.br,https://lupacnpjs.com.br,https://lupa-cnpj.vercel.app,http://localhost:4200}
  security:
    trust-proxy: true
    historico-per-minute: 30
    read-per-minute: 60
    consulta-per-minute: 30
    admin-per-minute: 30
    redis-url: ${REDIS_URL:}

cnpj:
  api:
    token: ${CNPJ_WS_TOKEN:${CNPJ_API_TOKEN:}}
    pesquisa-razao-social-habilitada: ${PESQUISA_RAZAO_SOCIAL:false}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  public-key: ${MERCADOPAGO_PUBLIC_KEY:}
  frontend-url: ${FRONTEND_URL:https://www.lupacnpjs.com.br}
  api-public-url: ${API_PUBLIC_URL:https://lupa-cnpj-api-production.up.railway.app}
  premium-price-cents: ${MERCADOPAGO_PREMIUM_PRICE_CENTS:990}
  pro-plus-price-cents: ${MERCADOPAGO_PRO_PLUS_PRICE_CENTS:2990}
  admin-test-price-cents: ${MERCADOPAGO_ADMIN_TEST_PRICE_CENTS:100}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
