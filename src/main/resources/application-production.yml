spring:
  datasource:
    # DB_URL deve ser JDBC (jdbc:mysql://...). MYSQL_URL do Railway é tratada em DatabaseConfig.
    url: ${DB_URL:}
    username: ${DB_USERNAME:${MYSQLUSER:}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    secret: ${JWT_SECRET}
  cors-allowed-origins: ${ALLOWED_ORIGINS:https://lupa-insights.vercel.app,http://localhost:4200,https://*.vercel.app}

cnpj:
  api:
    token: ${CNPJ_WS_TOKEN:${CNPJ_API_TOKEN:}}
    pesquisa-razao-social-habilitada: ${PESQUISA_RAZAO_SOCIAL:false}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  public-key: ${MERCADOPAGO_PUBLIC_KEY:}
  frontend-url: ${FRONTEND_URL:https://lupa-insights.vercel.app}
  api-public-url: ${API_PUBLIC_URL:https://lupa-cnpj-api-production.up.railway.app}
  premium-price-cents: ${MERCADOPAGO_PREMIUM_PRICE_CENTS:4990}
  pro-plus-price-cents: ${MERCADOPAGO_PRO_PLUS_PRICE_CENTS:9990}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
